name: Tests

on:
  push:
  pull_request:

jobs:
  test-cpu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg', 'setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel grpcio-tools
          git clone https://github.com/learning-at-home/hivemind.git /tmp/hivemind
          git -C /tmp/hivemind checkout 4bd43b77895019b20d18d81d0d0c1a5ab9a10847
          python - <<'PY'
          from pathlib import Path
          pyproject = Path("/tmp/hivemind/pyproject.toml")
          text = pyproject.read_text()
          old = 'license = "MIT"'
          new = 'license = {text = "MIT"}'
          if old not in text:
              raise SystemExit("Expected Hivemind pyproject license field not found")
          pyproject.write_text(text.replace(old, new, 1))

          for path in (Path("setup.py"), Path("setup.cfg")):
              lines = path.read_text().splitlines()
              filtered = [
                  line
                  for line in lines
                  if "hivemind @ git+https://github.com/learning-at-home/hivemind.git@4bd43b77895019b20d18d81d0d0c1a5ab9a10847"
                  not in line
              ]
              path.write_text("\n".join(filtered) + "\n")
          PY
          python -m pip install --no-build-isolation --no-deps /tmp/hivemind
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Run CPU unit tests
        run: |
          pytest -v \
            tests/test_cache.py \
            tests/test_serving_cache_regressions.py \
            tests/test_llama_kv_head_compat.py \
            tests/test_spec_cache_reorder_sync.py \
            tests/test_review_p1_fixes.py \
            tests/test_debug_config.py \
            tests/test_lossless_transport.py \
            tests/test_spec_decoding_verify.py \
            tests/test_spec_session_position.py \
            tests/test_gemma4_block_parity.py \
            tests/test_gemma4_head_dim_dispatch.py \
            tests/test_gemma4_kv_eq_v.py \
            tests/test_backend_tree_position_ids.py \
            tests/test_spe_dec_tree.py \
            tests/test_fast_generate_eligibility.py \
            tests/test_qwen3_block_parity.py \
            tests/test_recovery_history_source.py
